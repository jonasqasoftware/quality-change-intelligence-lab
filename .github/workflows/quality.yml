name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.18.x"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...
      - name: Generate synthetic planning evidence
        run: mkdir -p reports && go run ./cmd/qci --out reports/sample-change-report.md
      - name: Upload generated evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-change-plan
          path: reports/sample-change-report.md
          if-no-files-found: error
